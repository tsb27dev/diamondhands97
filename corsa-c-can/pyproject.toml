[project]
name = "corsacan"
version = "0.1.0"
description = "Captura, análise e descodificação do CAN bus de um Opel Corsa C (2006, 1.3 CDTI)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["python-can>=4.3"]
dev = ["pytest"]

[project.scripts]
corsacan = "corsacan.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["corsacan"]
